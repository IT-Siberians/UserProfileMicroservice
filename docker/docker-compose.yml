services:
  backend:    
    build:
     context: ../src
     dockerfile: ../src/Dockerfile
    env_file: "backend.env"
    restart: always
    ports:
      - "8080:8080"
    depends_on:
       db:
        condition: service_healthy
  db:
    image: postgres:latest
    env_file: "db.env"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
