services:
  backend:    
    build:
     context: ../src
     dockerfile: ../src/Dockerfile
    restart: unless-stopped
    env_file: "backend.env"
    ports:
      - "9002:9002"
    depends_on:
       db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    image: postgres:latest
    restart: unless-stopped
    env_file: "db.env"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "profilesdb", "-U", "postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
